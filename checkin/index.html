<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Check-in — DevItape</title>
  <meta name="color-scheme" content="dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Archivo+Narrow:wght@600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <main class="checkin-page">
    <div class="checkin-card">
      <img class="checkin-logo" src="/assets/logo.png" alt="DevItape" width="48" height="48" />
      <h1 class="checkin-title">Check-in DevItape</h1>
      <p class="checkin-subtitle" id="checkin-subtitle">Digite o e-mail que você usou na inscrição.</p>

      <div class="checkin-picker" id="event-picker" hidden>
        <p class="checkin-picker-title">Qual evento é hoje?</p>
        <div id="event-picker-options"></div>
      </div>

      <form class="checkin-form" id="checkin-form" hidden>
        <input
          class="checkin-input"
          id="email-input"
          type="email"
          inputmode="email"
          autocomplete="email"
          placeholder="seuemail@exemplo.com"
          required
        />
        <button class="checkin-button" id="submit-button" type="submit">
          Fazer check-in
        </button>
      </form>

      <div class="checkin-picker" id="participant-picker" hidden>
        <p class="checkin-picker-title">Encontramos mais de uma inscrição com esse e-mail. Qual é a sua?</p>
        <div id="participant-picker-options"></div>
      </div>

      <div class="checkin-status" id="status-box" role="status" aria-live="polite">
        <div class="spinner" id="status-spinner" hidden></div>
        <p id="status-message"></p>
      </div>

      <div class="checkin-event-info" id="event-info-box">
        <h3 id="event-info-title"></h3>
        <p>Dá uma olhada na programação, fica à vontade e chama a gente se precisar de algo.</p>
        <div class="actions">
          <a class="btn-primary" id="event-info-link" href="#" target="_blank" rel="noopener noreferrer">
            Ver roteiro do evento
          </a>
          <button class="btn-secondary" id="event-info-share" type="button">Compartilhar</button>
        </div>
      </div>

      <div class="checkin-cta" id="cta-box">
        <p class="checkin-cta-label">Aproveite e siga a gente:</p>
        <div class="checkin-cta-links" id="cta-links"></div>
      </div>
    </div>
  </main>

  <script src="/assets/checkin.js"></script>
</body>
</html>
