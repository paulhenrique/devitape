<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Telão — Check-in DevItape</title>
  <meta name="color-scheme" content="dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Archivo+Narrow:wght@600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div class="telao-event-picker" id="event-picker" hidden>
    <div class="checkin-picker">
      <p class="checkin-picker-title">Qual evento é hoje?</p>
      <div id="event-picker-options"></div>
    </div>
  </div>

  <main class="telao-page">
    <section class="telao-qr-panel">
      <img class="checkin-logo" src="/assets/logo.png" alt="DevItape" width="48" height="48" />
      <div id="qr-container" class="telao-qr-big" aria-hidden="true"></div>
      <p class="telao-domain" id="domain-label"></p>
      <p class="telao-event-name" id="event-name"></p>
      <p class="telao-hint-compact">📱 Aponte a câmera pro QR e faça seu check-in</p>
    </section>

    <section class="telao-board">
      <div class="telao-spotlight" id="spotlight" hidden>
        <span class="telao-avatar telao-avatar--lg" id="spotlight-avatar"></span>
        <div class="telao-spotlight-text">
          <p class="telao-spotlight-label"><span class="telao-live-dot" aria-hidden="true"></span>Acabou de chegar</p>
          <p class="telao-spotlight-name" id="spotlight-name"></p>
        </div>
      </div>

      <div class="telao-bubbles" id="bubbles" aria-hidden="true"></div>

      <div class="telao-progress-wrap">
        <div class="telao-progress-header">
          <span class="telao-progress-percent" id="progress-percent">0%</span>
          <span class="telao-progress-label" id="progress-label">rumo à meta de hoje</span>
        </div>
        <div class="telao-progress-track">
          <div class="telao-progress-fill" id="progress-fill"></div>
        </div>
      </div>
    </section>
  </main>

  <div class="telao-offline" id="offline-badge">Sem conexão com o servidor</div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="/assets/telao.js"></script>
</body>
</html>
