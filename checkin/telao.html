<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Telão — Check-in DevItape</title>
  <meta name="color-scheme" content="dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Archivo+Narrow:wght@600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body class="telao-body">
  <div class="telao-bg" aria-hidden="true">
    <div class="telao-blob"></div>
    <div class="telao-blob"></div>
    <div class="telao-blob"></div>
    <div class="telao-blob"></div>
  </div>
  <div class="telao-float-layer" id="float-layer" aria-hidden="true"></div>

  <div class="telao-event-picker" id="event-picker" hidden>
    <div class="checkin-picker">
      <p class="checkin-picker-title">Qual evento é hoje?</p>
      <div id="event-picker-options"></div>
    </div>
  </div>

  <header class="telao-brand">
    <img src="/assets/logo.png" alt="DevItape" width="40" height="40" />
    <p class="telao-event-name" id="event-name"></p>
  </header>

  <main class="telao-page">
    <div class="telao-qr" id="qr-container" aria-hidden="true"></div>

    <h1 class="telao-cta-title">Faça seu check-in</h1>
    <ol class="telao-steps">
      <li><span class="step-num">1</span> Abra a câmera do celular</li>
      <li><span class="step-num">2</span> Aponte para o QR code</li>
      <li><span class="step-num">3</span> Digite o e-mail da inscrição</li>
    </ol>
    <p class="telao-domain" id="domain-label"></p>

    <section class="telao-progress" aria-label="Chegada do público">
      <div class="telao-progress-row">
        <div class="telao-progress-track">
          <div class="telao-progress-fill is-empty" id="progress-fill">
            <span class="telao-progress-spark"></span>
          </div>
        </div>
        <span class="telao-progress-percent" id="progress-percent">0%</span>
      </div>
      <p class="telao-progress-label" id="progress-label">rumo à meta de hoje</p>
    </section>

    <div class="telao-stack" id="stack"></div>
  </main>

  <div class="telao-offline" id="offline-badge">Sem conexão com o servidor</div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="/assets/telao.js"></script>
</body>
</html>
