<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Telão — Check-in DevItape</title>
  <meta name="color-scheme" content="dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Archivo+Narrow:wght@600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div class="telao-event-picker" id="event-picker" hidden>
    <div class="checkin-picker">
      <p class="checkin-picker-title">Qual evento é hoje?</p>
      <div id="event-picker-options"></div>
    </div>
  </div>

  <main class="telao-page">
    <section class="telao-qr-panel">
      <img class="checkin-logo" src="/assets/logo.png" alt="DevItape" width="48" height="48" />
      <div id="qr-container" aria-hidden="true"></div>
      <p class="telao-domain" id="domain-label"></p>
      <p class="telao-event-name" id="event-name"></p>
      <ol class="telao-steps">
        <li><span class="step-num">1</span> Abra a câmera do celular</li>
        <li><span class="step-num">2</span> Aponte para o QR code acima</li>
        <li><span class="step-num">3</span> Digite seu e-mail e toque em "Fazer check-in"</li>
      </ol>
    </section>

    <section class="telao-board">
      <div class="telao-counter">
        <span class="num" id="present-count">0</span>
        <span class="label">de <span id="total-count">0</span> presentes</span>
      </div>

      <p class="telao-list-title"><span class="telao-live-dot" aria-hidden="true"></span>Chegando agora</p>
      <ul class="telao-list" id="telao-list"></ul>
    </section>
  </main>

  <div class="telao-offline" id="offline-badge">Sem conexão com o servidor</div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="/assets/telao.js"></script>
</body>
</html>
